---
kind: pipeline
type: kubernetes
name: default
platform:
  arch: arm64

trigger:
  branch:
  - main

# MongoDB for the API integration tests. In a Kubernetes pipeline services share
# the pod's network, so the tests reach it on localhost.
services:
- name: mongo
  image: mongo:7

steps:
# ── Tests (every push and PR; a failure stops the build before publish/deploy) ─
- name: test-api
  image: node:20
  environment:
    TEST_MONGODB_URI: mongodb://localhost:27017
    MONGOMS_DISABLE_POSTINSTALL: "1"   # uses the service above, no mongod download
  commands:
  - cd api
  - npm ci
  - npm run test:unit
  - npm run test:integration

# ── Build & push the single image (API + built React bundle) ─────────────────
# Built from the repo root: the Dockerfile's web/ stage needs it in context.
- name: publish
  image: plugins/kaniko-ecr
  settings:
    create_repository: true
    registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
    repo: amp-delivery/${DRONE_REPO_NAME}
    dockerfile: Dockerfile
    context: .
    tags:
    - git-${DRONE_COMMIT_SHA:0:7}
    - latest
    access_key:
      from_secret: ecr_access_key
    secret_key:
      from_secret: ecr_secret_key
  when:
    event:
    - push

# ── Deploy to staging (public ingress, Okta via CorpSecure) ──────────────────
- name: deploy-staging
  image: public.ecr.aws/kanopy/drone-helm:v3
  settings:
    chart: mongodb/web-app
    chart_version: 4.25.0
    add_repos: [mongodb=https://10gen.github.io/helm-charts]
    namespace: amp-delivery
    release: delivery-hub
    values: arch=arm64,image.tag=git-${DRONE_COMMIT_SHA:0:7},image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/amp-delivery/${DRONE_REPO_NAME},ingress.enabled=true,ingress.hosts[0]=delivery-hub.amp-delivery.staging.corp.mongodb.com,mesh.enabled=true
    values_files: ["environments/staging.yaml"]
    api_server: https://api.staging.corp.mongodb.com
    kubernetes_token:
      from_secret: staging_kubernetes_token
  when:
    event:
    - push
